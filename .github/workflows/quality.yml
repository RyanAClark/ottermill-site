name: Code quality

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Provision pinned tools
        shell: bash
        run: |
          python -m pip install "ruff==0.16.2"
          if [ -f package-lock.json ]; then npm ci; fi
      - name: Check committed tree
        env:
          QUALITY_GATE_BASE: ${{ github.event.before }}
        run: python scripts/quality_gate.py --tree
