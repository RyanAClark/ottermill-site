name: Site check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision pinned quality tools
        run: python -m pip install -r requirements-quality.txt
      - name: Check markup and internal references
        run: python scripts/check_site.py
      - name: Run checker tests
        run: python -m pytest -q
