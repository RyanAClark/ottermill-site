<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ottermill</title>
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0F172A; color: #E2E8F0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .wrap { max-width: 560px; text-align: center; }
    h1 { font-size: 2.2rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
    .tag { margin-top: 12px; color: #94A3B8; font-size: 1.05rem; line-height: 1.6; }
    .apps { margin-top: 40px; text-align: left; }
    .app { display: block; background: #1E293B; border: 1px solid #334155; border-radius: 14px; padding: 18px 20px; text-decoration: none; color: inherit; }
    .app:hover { border-color: #4F46E5; }
    .app .name { font-weight: 700; color: #fff; }
    .app .desc { margin-top: 4px; color: #94A3B8; font-size: 0.95rem; }
    footer { margin-top: 48px; color: #64748B; font-size: 0.85rem; line-height: 1.7; }
    a { color: #818CF8; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Ottermill</h1>
    <p class="tag">A small studio making focused, carefully built apps.</p>
    <div class="apps">
      <a class="app" href="/actuo/">
        <span class="name">Σ Actuo — Actuary Exam Planner</span>
        <span class="desc">Day-by-day study plans for SOA Exam P &amp; FM. Local-first, works offline.</span>
      </a>
    </div>
    <footer>
      <a href="mailto:support@ottermill.app">support@ottermill.app</a><br />
      © 2026 Ottermill
    </footer>
  </div>
</body>
</html>
